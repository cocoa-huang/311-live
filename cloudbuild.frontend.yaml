steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - frontend/Dockerfile
      - --build-arg
      - NEXT_PUBLIC_WS_BASE_URL=${_NEXT_PUBLIC_WS_BASE_URL}
      - --build-arg
      - NEXT_PUBLIC_API_BASE_URL=${_NEXT_PUBLIC_API_BASE_URL}
      - --build-arg
      - NEXT_PUBLIC_REAL_LOCATION_MODE=${_NEXT_PUBLIC_REAL_LOCATION_MODE}
      - -t
      - ${_IMAGE}
      - .
images:
  - ${_IMAGE}
